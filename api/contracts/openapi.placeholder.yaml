openapi: 3.1.0
info:
  title: Rosevear Comms Hub API
  version: 0.0.2
  description: Placeholder contract for the shared brand-aware communications API. QL-002 does not implement a live API.
servers:
  - url: http://localhost:8787
    description: Future local API worker
paths:
  /health:
    get:
      summary: Future API health check
      responses:
        '200':
          description: Healthy
  /brands:
    get:
      summary: List enabled brand workspaces
      responses:
        '200':
          description: Brand list
  /conversations:
    get:
      summary: List conversations filtered by brand and status
      parameters:
        - name: brand
          in: query
          required: false
          schema:
            type: string
            enum: [rosiedazzlers, devilndove]
      responses:
        '200':
          description: Conversation list
  /conversations/{conversationId}:
    get:
      summary: Get one conversation
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Conversation detail
