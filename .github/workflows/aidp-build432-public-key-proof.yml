name: AIDP Build 432 Public Key Proof

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/aidp-build432-public-key-proof.yml'

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read deployed Cloudflare signer public evidence
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --max-time 15 'https://rosevear-comms-hub.devilndovelive.workers.dev/internal/rosevear/sysop/telemetry/v1/public-key')"
          python - "$body" <<'PY'
          import json,sys
          d=json.loads(sys.argv[1])
          print("BUILD432_COMMS_SPKI_SHA256="+d["fingerprint"])
          import base64
          print("BUILD432_COMMS_PUBLIC_KEY_PEM_B64="+base64.b64encode(d["publicKeyPem"].encode()).decode())
          PY
