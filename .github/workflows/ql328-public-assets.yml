name: Public Disabled-Preview Asset Verification (QL-328 onward)

# QL-336A: main-push verification moved into App scaffold CI, as the
# same named fail-closed job. Keep this independent manual rerun available.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-worker-asset-parity:
    name: Public Worker JS/CSS SHA-256 parity
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VITE_ENABLE_SUPABASE_CLIENT: 'false'
      VITE_ENABLE_HOSTED_DATABASE: 'false'
      VITE_PHONE_SMS_PROVIDER_ENABLED: 'false'
      VITE_PHONE_SMS_LIVE_PILOT_ENABLED: 'false'
      VITE_PHONE_SMS_CALLBACKS_ENABLED: 'false'
      VITE_PHONE_SMS_PERSISTENCE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Rebuild disabled production preview
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Verify public Worker serves exact built assets
        run: python3 scripts/ql328-public-asset-parity.py
