name: App scaffold CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Run unchanged fail-closed release gates (QL-336A)
        run: bash ../scripts/ql336a-required-gates.sh

  original-owner-keys-windows:
    name: QL-340 Windows encrypted owner key safety
    runs-on: windows-latest
    steps:
      - name: Allow existing long repository paths in Git for Windows
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Windows key material never needs an unattended approval
        run: node --test runtimes/hub-relay/owner-authority-custody.test.mjs
      - name: Verify Windows offline dual-owner TEST enrollment ceremony
        run: node --test runtimes/hub-relay/ql340b-enrollment.test.mjs
      - name: Verify QL-340C signed TEST activation scope and hold controls
        run: node --test runtimes/hub-relay/ql340c-activation-check.test.mjs
      - name: Verify QL-341 private six-peer registry and TEST witness fail-closed
        run: node --test runtimes/hub-relay/ql341-private-readback.test.mjs
      - name: Verify QL-342 dual-owner decision and exactly one TEST receipt safety
        run: node --test runtimes/hub-relay/ql342-owner-decision.test.mjs
      - name: Verify QL-342A inert Windows loopback shutdown and review safety
        run: node --test runtimes/hub-relay/ql342a-rollback-drill.test.mjs
      - name: Verify QL-343 original public evidence and independent signing review boundaries
        run: node --test runtimes/hub-relay/ql343-owner-evidence-review.test.mjs
      - name: Verify QL-344 original receiver-OFF and issuer-byte reconciliation boundaries
        run: node --test runtimes/hub-relay/ql344-off-attestation.test.mjs
      - name: Verify QL-344 Windows observer remains read-only on non-original CI machines
        shell: pwsh
        run: .\runtimes\hub-relay\ql344-windows-off-observer.ps1 -Status
      - name: Verify QL-340C current-user Windows DPAPI without real credentials
        shell: pwsh
        run: .\runtimes\hub-relay\ql340c-windows-operator.ps1 -SelfTest
      - name: Verify QL-340C receiver remains offline without real owner approvals
        shell: pwsh
        run: .\runtimes\hub-relay\ql340c-windows-operator.ps1 -Status
      - name: Verify QL-342 original Windows owner preflight stays read-only
        shell: pwsh
        run: .\runtimes\hub-relay\ql340c-windows-operator.ps1 -OwnerPreflight
      - name: Inspect missing keys without generating authority or network access
        run: node runtimes/hub-relay/owner-authority-custody.mjs --inspect

  public-worker-asset-parity:
    name: Public Worker JS/CSS SHA-256 parity
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: app-build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VITE_ENABLE_SUPABASE_CLIENT: 'false'
      VITE_ENABLE_HOSTED_DATABASE: 'false'
      VITE_PHONE_SMS_PROVIDER_ENABLED: 'false'
      VITE_PHONE_SMS_LIVE_PILOT_ENABLED: 'false'
      VITE_PHONE_SMS_CALLBACKS_ENABLED: 'false'
      VITE_PHONE_SMS_PERSISTENCE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Rebuild disabled production preview
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Verify public Worker serves exact built assets
        run: python3 scripts/ql328-public-asset-parity.py
