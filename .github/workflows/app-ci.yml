name: App scaffold CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Parse Cloudflare Worker entrypoint
        run: node --check ../worker/build432-sysop-telemetry.js
      - name: Run unchanged fail-closed release gates (QL-336A)
        run: bash ../scripts/ql336a-required-gates.sh
      - name: Verify QL-482 private case-read and independent Yard Workers review
        run: node --test ../runtimes/master-telemetry/ql482-protected-case-read.test.mjs
      - name: Verify QL-483 original YW enrollment, scoped mTLS ingress and independent field HOLD
        run: node --test ../runtimes/master-telemetry/ql483-original-yw-field.test.mjs ../runtimes/master-telemetry/ql483-original-windows-enroll.test.mjs
      - name: Verify QL-484 original-host private YW field correlation, mTLS endpoint and release provenance
        run: node --test ../runtimes/master-telemetry/ql484-supervised-original-host-field.test.mjs ../runtimes/master-telemetry/ql484-private-field-https.test.mjs ../runtimes/master-telemetry/ql484-original-host-cli.test.mjs
      - name: QL-485 six-source signed contract negotiation, owner-private receipt and Git divergence diagnostics
        run: node --test ../runtimes/master-discovery/ql485-signed-release-negotiation.test.mjs ../runtimes/master-discovery/ql485-offline-compatibility-cli.test.mjs
      - name: QL-486 six-app durable source registry, signed runtime claims, mTLS operator console
        run: node --test ../runtimes/master-discovery/ql486-six-source-registry.test.mjs ../runtimes/master-discovery/ql486-private-operator-console.test.mjs ../runtimes/master-discovery/ql486-original-host-console-cli.test.mjs
      - name: QL-487 supervised private six-source signed drift and operator reconciliation
        run: node --test ../runtimes/master-discovery/ql487-supervised-sync.test.mjs
      - name: QL-488 pinned six-source private transport and durable operator HOLD receipts
        run: node --test ../runtimes/master-discovery/ql488-original-host-transport.test.mjs
      - name: QL-488 original owner private probe remains inert on CI
        run: node ../runtimes/master-discovery/ql488-original-host-probe-cli.mjs --status
      - name: QL-489 six-source signed live capture and exception closure regression
        run: node --test ../runtimes/master-discovery/ql489-live-source-capture.test.mjs
      - name: QL-489 original host remains inert on CI
        run: node ../runtimes/master-discovery/ql489-original-host-cli.mjs --status
      - name: QL-490 independent receipt readback, signed exception aging and no-send recovery drill
        run: node --test ../runtimes/master-discovery/ql490-independent-field-readback.test.mjs
      - name: QL-490 original-host CLI remains network-inert in CI
        run: node ../runtimes/master-discovery/ql490-original-host-cli.mjs --status
      - name: QL-491 durable exception intake, original-host proof follow-up and drill trends
        run: node --test ../runtimes/master-discovery/ql491-exception-intake.test.mjs
      - name: QL-491 local owner status remains non-networking on CI
        run: node ../runtimes/master-discovery/ql491-original-host-cli.mjs --status
      - name: QL-492 signed witness claims, due-date no-send escalation and six-source Master audit
        run: node --test ../runtimes/master-discovery/ql492-field-witness-audit.test.mjs
      - name: QL-492 original owner offline status remains inert on CI
        run: node ../runtimes/master-discovery/ql492-original-host-cli.mjs --status
      - name: QL-493 mTLS cert/key readiness, signed Master handoff and ACK anti-replay
        run: node --test ../runtimes/master-discovery/ql493-private-source-master-handoff.test.mjs
      - name: QL-493 original host status must remain network-inert on CI
        run: node ../runtimes/master-discovery/ql493-original-host-cli.mjs --status
      - name: QL-494 first-source signed private receiver receipt, anti-TOFU and independent Master correlation
        run: node --test ../runtimes/master-discovery/ql494-first-source-receiver.test.mjs
      - name: QL-494 original owner status remains offline and non-networking on CI
        run: node ../runtimes/master-discovery/ql494-original-host-cli.mjs --status
      - name: QL-495 independent receipt provenance, attestation drift and pinned Master trial receipt safety
        run: node --test ../runtimes/master-discovery/ql495-source-provenance-master-trial.test.mjs
      - name: QL-495 owner CLI default stays no-send with no source certification
        run: node ../runtimes/master-discovery/ql495-original-host-cli.mjs --status
      - name: QL-496 private Master signed mTLS endpoint, device witness and source-to-Master anti-replay safety
        run: node --test ../runtimes/master-discovery/ql496-master-endpoint-contract.test.mjs
      - name: QL-496 original owner CLI is no-listen and no-send in CI
        run: node ../runtimes/master-discovery/ql496-original-host-cli.mjs --status
      - name: QL-497 independently signed Master enrollment, device hardware witness and cross-ledger audit regressions
        run: node --test ../runtimes/master-discovery/ql497-independent-master-enrollment.test.mjs
      - name: QL-497 original Windows owner CLI must stay no-send on CI
        run: node ../runtimes/master-discovery/ql497-original-host-cli.mjs --status
      - name: QL-498 independent cross-host signed runtime observation and fail-closed review regressions
        run: node --test ../runtimes/master-discovery/ql498-cross-host-runtime-evidence.test.mjs
      - name: QL-498 original Windows owner release status remains no-send
        run: node ../runtimes/master-discovery/ql498-original-host-cli.mjs --status
      - name: QL-499 pinned TLS13 original Windows handshake and independent path signature tests (no network)
        run: node --test ../runtimes/master-discovery/ql499-original-path-probe.test.mjs
      - name: QL-499 original Windows CLI must default to no network
        run: node ../runtimes/master-discovery/ql499-original-host-cli.mjs --status
      - name: QL-500 original Master config inventory, signed two-sided custody and fail-closed audit
        run: node --test ../runtimes/master-discovery/ql500-original-provider-custody.test.mjs
      - name: QL-500 no-network original Windows provider inventory status
        run: node ../runtimes/master-discovery/ql500-original-host-cli.mjs --status
      - name: QL-501 source-signed original private Master trial, provider ACK and replay safety
        run: node --test ../runtimes/master-discovery/ql501-source-signed-delivery-trial.test.mjs
      - name: QL-501 original-host live trial must never run in CI
        run: node ../runtimes/master-discovery/ql501-original-host-cli.mjs --status
      - name: QL-501 Python cross-language source-of-truth safety checks
        run: python3 ../scripts/ql501_source_of_truth_python_checks.py
      - name: QL-502 independently signed provider delivery proof, saved vs accepted vs delivered and stale reply
        run: node --test ../runtimes/master-discovery/ql502-provider-delivery-proof.test.mjs
      - name: QL-502 actual existing iCamp inbox version truth and cross-tenant React acceptance
        run: npx vitest run src/operator/__tests__/ql502DeliveryTruth.test.tsx
      - name: QL-502 Python cross-language tenant, consent and delivery-status verification
        run: python3 ../scripts/ql502_source_of_truth_python_checks.py
      - name: QL-503 server-only Ed25519 signed durable receipt import, no-send and migration regression
        run: node --test ../runtimes/master-discovery/ql503-durable-verified-import.test.mjs
      - name: QL-503 authenticated exact-tenant React inbox history, no unauthorized read/write
        run: npx vitest run src/operator/__tests__/ql503DeliveryHistory.test.tsx
      - name: QL-503 cross-language database RLS migration and no-key fail-closed verification
        run: python3 ../scripts/ql503_source_truth_python_checks.py

  original-owner-keys-windows:
    name: QL-340 Windows encrypted owner key safety
    runs-on: windows-latest
    steps:
      - name: Allow existing long repository paths in Git for Windows
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse QL-475 original-host archive stager and confirm nonoriginal CI remains blocked
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'runtimes/master-telemetry/ql475-three-archive-original-host.ps1'),
            [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) { throw 'QL475_POWERSHELL_PARSE_FAILED' }
          try {
            & .\runtimes\master-telemetry\ql475-three-archive-original-host.ps1 -Mode Inspect
            throw 'QL475_NONORIGINAL_HOST_UNEXPECTEDLY_ACCEPTED'
          } catch {
            if ($_.Exception.Message -notmatch 'HOLD_QL475_ORIGINAL_HOST_REQUIRED') { throw }
          }
      - name: Parse QL-476 supervised Windows worker and reject nonoriginal CI
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'runtimes/master-telemetry/ql476-original-host-worker.ps1'),
            [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) { throw 'QL476_POWERSHELL_PARSE_FAILED' }
          try {
            & .\runtimes\master-telemetry\ql476-original-host-worker.ps1 -Mode Inspect
            throw 'QL476_NONORIGINAL_HOST_UNEXPECTEDLY_ACCEPTED'
          } catch {
            if ($_.Exception.Message -notmatch 'HOLD_QL476_ORIGINAL_HOST_REQUIRED') { throw }
          }
      - name: Parse QL-477 original-host evidence exporter and reject untrusted CI host
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'runtimes/master-telemetry/ql477-original-host-evidence.ps1'),
            [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) { throw 'QL477_POWERSHELL_PARSE_FAILED' }
          try {
            & .\runtimes\master-telemetry\ql477-original-host-evidence.ps1 -Mode Inspect
            throw 'QL477_CI_HOST_INCORRECTLY_ACCEPTED'
          } catch {
            if ($_.Exception.Message -notmatch 'HOLD_QL477_ORIGINAL_HOST_REQUIRED') { throw }
          }
      - name: Parse QL-478 original-host reconciliation; reject CI environment and manual pilot
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'runtimes/master-telemetry/ql478-original-host-reconcile.ps1'),
            [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) { throw 'QL478_POWERSHELL_PARSE_FAILED' }
          try {
            & .\runtimes\master-telemetry\ql478-original-host-reconcile.ps1 -Mode Inspect
            throw 'QL478_UNTRUSTED_WINDOWS_RUNNER_ACCEPTED'
          } catch {
            if ($_.Exception.Message -notmatch 'HOLD_QL478_ORIGINAL_HOST_REQUIRED') { throw }
          }
          # The Node CLI is also guarded at its entrypoint. Do not execute an
          # expected nonzero native command in pwsh's ErrorActionPreference=Stop.
          $nodeSource = Get-Content -LiteralPath 'runtimes/master-telemetry/ql478-owner-loopback-cli.mjs' -Raw
          if ($nodeSource -notmatch "process\.platform!=='win32'\|\|process\.env\.COMPUTERNAME!=='DESKTOP-AE894KC'" -or
              $nodeSource -notmatch "HOLD\('ORIGINAL_HOST_REQUIRED'\)") {
            throw 'QL478_ORIGINAL_NODE_HOST_GUARD_MISSING'
          }
      - name: QL-479 original-host remote pilot must never run in CI
        shell: pwsh
        run: |
          $source = Get-Content -LiteralPath 'runtimes/master-telemetry/ql479-supervised-remote-cli.mjs' -Raw
          if ($source -notmatch "process.platform!=='win32'" -or
              $source -notmatch "DESKTOP-AE894KC" -or
              $source -notmatch "SUPERVISED_ONE_TIME" -or
              $source -notmatch "--supervised-source-send" -or
              $source -notmatch "--supervised-receiver") {
            throw 'QL479_ORIGINAL_HOST_ENROLLMENT_OR_OPERATOR_GUARD_MISSING'
          }
      - name: QL-480 incident adapter must remain a private no-send library
        shell: pwsh
        run: |
          $source = Get-Content 'runtimes/master-telemetry/ql480-scoped-incident-adapter.mjs' -Raw
          if ($source -notmatch "publicRoute:false" -or
              $source -notmatch "automaticDispatch:false" -or
              $source -notmatch "SIMULATED_PRIVATE_NO_SEND" -or
              $source -notmatch "fsyncSync" -or
              $source -match "\b(?:fetch|createServer|Register-ScheduledTask|Start-ScheduledTask)\s*\(") {
            throw 'QL480_INTEGRITY_BOUNDARY_BROKEN'
          }
