name: App scaffold CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: node ../scripts/__tests__/ql170-release-receipt.test.mjs
      - run: node --test ../scripts/__tests__/ql171-operator-baseline.test.mjs
      - run: node --test ../scripts/__tests__/ql188-synthetic-server-harness.test.mjs
      - run: node ../scripts/__tests__/ql208-provider-gateway-sandbox.test.mjs
      - run: node ../scripts/__tests__/ql238-integration-handshake.test.mjs
      - run: node ../scripts/__tests__/ql239-credential-rotation-dry-run.test.mjs
      - run: node ../scripts/__tests__/ql240-nonproduction-receipt-verifier.test.mjs
      - run: node ../scripts/__tests__/ql241-external-gateway-retrieval.test.mjs
      - run: node ../scripts/__tests__/ql242-gateway-audit-owner-rehearsal.test.mjs
      - run: node ../scripts/__tests__/ql243-secure-gateway-connection.test.mjs
      - run: node ../scripts/__tests__/ql244-witnessed-handshake-review.test.mjs
      - run: node ../scripts/__tests__/ql245-six-app-evidence-review.test.mjs
      - run: node ../scripts/__tests__/ql247-six-app-github-census.test.mjs
      - run: node ../scripts/__tests__/ql248-proof-commit-reconciliation.test.mjs
      - run: node ../scripts/__tests__/ql249-public-github-origin-retest.test.mjs
      - run: node ../scripts/__tests__/ql250-pin-custody-window-witness.test.mjs
      - run: node --test ../scripts/__tests__/ql189-operations-safety-harness.test.mjs
      - run: node ../scripts/ql190-packet-integrity-audit.mjs
      - run: node --test ../scripts/__tests__/ql190-packet-integrity-audit.test.mjs
      - run: node ../scripts/ql171-operator-baseline.mjs
      - run: npm run build
