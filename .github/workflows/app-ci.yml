name: App scaffold CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Run unchanged fail-closed release gates (QL-336A)
        run: bash ../scripts/ql336a-required-gates.sh

  original-owner-keys-windows:
    name: QL-340 Windows encrypted owner key safety
    runs-on: windows-latest
    steps:
      - name: Allow existing long repository paths in Git for Windows
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Windows key material never needs an unattended approval
        run: node --test runtimes/hub-relay/owner-authority-custody.test.mjs
      - name: Verify Windows offline dual-owner TEST enrollment ceremony
        run: node --test runtimes/hub-relay/ql340b-enrollment.test.mjs
      - name: Verify QL-340C signed TEST activation scope and hold controls
        run: node --test runtimes/hub-relay/ql340c-activation-check.test.mjs
      - name: Verify QL-341 private six-peer registry and TEST witness fail-closed
        run: node --test runtimes/hub-relay/ql341-private-readback.test.mjs
      - name: Verify QL-342 dual-owner decision and exactly one TEST receipt safety
        run: node --test runtimes/hub-relay/ql342-owner-decision.test.mjs
      - name: Verify QL-342A inert Windows loopback shutdown and review safety
        run: node --test runtimes/hub-relay/ql342a-rollback-drill.test.mjs
      - name: Verify QL-343 original public evidence and independent signing review boundaries
        run: node --test runtimes/hub-relay/ql343-owner-evidence-review.test.mjs
      - name: Verify QL-344 original receiver-OFF and issuer-byte reconciliation boundaries
        run: node --test runtimes/hub-relay/ql344-off-attestation.test.mjs
      - name: Verify QL-344 Windows observer remains read-only on non-original CI machines
        shell: pwsh
        run: .\runtimes\hub-relay\ql344-windows-off-observer.ps1 -Status
      - name: Verify QL-345 independent review dispositions never authorize TEST enrollment
        run: node --test runtimes/hub-relay/ql345-issuer-owner-preflight.test.mjs
      - name: Verify QL-346 original issuer signature and separately signed TEST owner approval remain offline
        run: node --test runtimes/hub-relay/ql346-issuer-test-readiness.test.mjs
      - name: Verify QL-347 dual-owner custody reconciliation never enables enrollment
        run: node --test runtimes/hub-relay/ql347-custody-handoff.test.mjs
      - name: Verify QL-348 one TEST receipt and six-peer diagnostics remain read-only
        run: node --test runtimes/hub-relay/ql348-supervised-test-diagnostics.test.mjs
      - name: Verify QL-349 six-source TEST orchestration and independent failure recovery
        run: node --test runtimes/hub-relay/ql349-six-peer-orchestrator.test.mjs
      - name: Verify QL-350 private bridge, operator session and guided TEST fail-closed
        run: node --test runtimes/hub-relay/ql350-private-control-bridge.test.mjs
      - name: Verify QL-351 original Windows adapter provenance and isolated owner staging
        run: node --test runtimes/hub-relay/ql351-windows-private-adapter.test.mjs
      - name: Verify QL-351 non-original Windows CI runner cannot install adapter
        shell: pwsh
        run: .\runtimes\hub-relay\ql351-windows-private-adapter.ps1 -Status
      - name: Verify QL-352 Tailnet-only transport and independent LAN process safety
        run: node --test runtimes/hub-relay/ql352-tailnet-gateway.test.mjs runtimes/hub-relay/ql352-windows-tailnet-gateway.test.mjs
      - name: Verify QL-352 CI runner can only perform inert status readback
        shell: pwsh
        run: .\runtimes\hub-relay\ql352-windows-tailnet-gateway.ps1 -Status
      - name: Verify QL-353 original-owner private session and exactly one genuine receipt gate
        run: node --test runtimes/hub-relay/ql353-original-owner-session.test.mjs runtimes/hub-relay/ql353-windows-original-readback.test.mjs
      - name: Verify QL-353 CI runner cannot observe or enroll the original device
        shell: pwsh
        run: .\runtimes\hub-relay\ql353-windows-original-readback.ps1 -Status
      - name: Verify QL-354 original dual-owner intake and first challenge fail closed
        run: node --test runtimes/hub-relay/ql354-original-owner-intake.test.mjs runtimes/hub-relay/ql354-windows-owner-handoff.test.mjs
      - name: Verify QL-354 nonoriginal Windows runner cannot authorize or enroll
        shell: pwsh
        run: .\runtimes\hub-relay\ql354-windows-owner-handoff.ps1 -Status
      - name: Verify QL-355 original external issuer signature, independent witness and one TEST acceptance
        run: node --test runtimes/hub-relay/ql355-independent-authority.test.mjs
      - name: Verify QL-356 original public-owner pin custody and one field TEST acceptance gate
        run: node --test runtimes/hub-relay/ql356-original-field-readback.test.mjs runtimes/hub-relay/ql356-windows-field-handoff.test.mjs
      - name: Verify QL-356 nonoriginal Windows runner is inert
        shell: pwsh
        run: .\runtimes\hub-relay\ql356-windows-field-handoff.ps1 -Status
      - name: Verify QL-357 original signed enrollment private receiver and one cross-device TEST gate
        run: node --test runtimes/hub-relay/ql357-original-activation.test.mjs runtimes/hub-relay/ql357-windows-owner-activation.test.mjs
      - name: Verify QL-357 nonoriginal Windows CI cannot enroll or activate
        shell: pwsh
        run: .\runtimes\hub-relay\ql357-windows-owner-activation.ps1 -Status
      - name: Verify QL-358 original issuer custody limited receiver and genuine TEST gate
        run: node --test runtimes/hub-relay/ql358-field-credential-reconciliation.test.mjs runtimes/hub-relay/ql358-windows-original-field.test.mjs
      - name: Verify QL-358 nonoriginal Windows CI remains inert and credential-free
        shell: pwsh
        run: .\runtimes\hub-relay\ql358-windows-original-field.ps1 -Status
      - name: Verify QL-359 original authority, witnessed receiver STOP and signed TEST closeout
        run: node --test runtimes/hub-relay/ql359-supervised-private-closeout.test.mjs runtimes/hub-relay/ql359-windows-supervised-test.test.mjs
      - name: Verify QL-359 nonoriginal Windows CI cannot provision or execute a private TEST
        shell: pwsh
        run: .\runtimes\hub-relay\ql359-windows-supervised-test.ps1 -Status
      - name: Verify QL-360 original owner trust archive witnessed receiver shutdown and six HELD peers
        run: node --test runtimes/hub-relay/ql360-original-evidence-archive.test.mjs runtimes/hub-relay/ql360-windows-evidence-export.test.mjs runtimes/hub-relay/ql360-windows-private-storage.test.mjs
      - name: Verify QL-360 nonoriginal Windows CI cannot export private original evidence
        shell: pwsh
        run: .\runtimes\hub-relay\ql360-windows-evidence-export.ps1 -Status
      - name: Verify QL-361 archived chain, independently signed redaction audit and six-source hold handoff
        run: node --test runtimes/hub-relay/ql361-archived-chain-audit.test.mjs runtimes/hub-relay/ql361-windows-private-handoff.test.mjs
      - name: Verify QL-361 CI/Jack observer cannot read the private original Ree archive
        shell: pwsh
        run: .\runtimes\hub-relay\ql361-windows-owner-audit.ps1 -Status
      - name: Verify QL-362 separately pinned source/master owner signatures, one GET and six-app HOLD isolation
        run: node --test runtimes/hub-relay/ql362-source-owner-first-get.test.mjs runtimes/hub-relay/ql362-windows-source-owner-handoff.test.mjs
      - name: Verify QL-362 CI cannot read source handoff or run unattended source GET
        shell: pwsh
        run: .\runtimes\hub-relay\ql362-windows-source-owner-handoff.ps1 -Status
      - name: Verify QL-363 six independently source-signed health contracts, exact receipt adapters and immutable closeout
        run: node --test runtimes/hub-relay/ql363-six-source-health-adapters.test.mjs
      - name: Verify QL-365A first-time separate owner trust, signatures, original OFF baseline and unchanged receiver HOLD
        run: node --test runtimes/hub-relay/ql365a-first-time-trust.test.mjs
      - name: Verify QL-365A nonoriginal Windows CI cannot prepare, sign, assemble or enroll
        shell: pwsh
        run: node runtimes/hub-relay/ql365a-first-time-trust-cli.mjs --status
      - name: Verify QL-365B dual original-key review receipts, external independent decisions and supervised TEST HOLD
        run: node --test runtimes/hub-relay/ql365b-original-reconciliation.test.mjs
      - name: Verify QL-365B nonoriginal Windows CI remains inert and cannot review or reconcile
        shell: pwsh
        run: node runtimes/hub-relay/ql365b-original-review-cli.mjs --status
      - name: Verify QL-365C independent identity, original decision custody and supervised private TEST preflight HOLD
        run: node --test runtimes/hub-relay/ql365c-reviewer-custody.test.mjs
      - name: Verify QL-365C nonoriginal Windows CI cannot enroll reviewer or initiate TEST
        shell: pwsh
        run: node runtimes/hub-relay/ql365c-original-preflight-cli.mjs --status
      - name: Verify QL-365D original dual-owner one-source signatures and six-app handoff fail closed
        run: node --test runtimes/hub-relay/ql365d-first-test-ceremony.test.mjs
      - name: Verify QL-365D nonoriginal Windows CI cannot prepare signatures or authorize TEST
        shell: pwsh
        run: node runtimes/hub-relay/ql365d-original-test-cli.mjs --status
      - name: Verify QL-366 Rosevear Creations owner policy, source pins and fail-closed private TEST
        run: node --test runtimes/hub-relay/ql366-owner-controlled-private-test.test.mjs
      - name: Verify QL-366 CI cannot authorize an original-owner private TEST
        shell: pwsh
        run: node runtimes/hub-relay/ql366-original-owner-test-cli.mjs --help
      - name: Verify QL-368 independently scoped offline owner enrollment signatures and HOLD
        run: node --test runtimes/hub-relay/ql368-dual-owner-enrollment.test.mjs
      - name: Verify QL-368 nonoriginal Windows runner cannot sign enrollment evidence
        shell: pwsh
        run: node runtimes/hub-relay/ql368-owner-enrollment-cli.mjs --help
      - name: Verify QL-369 original Ed25519 packet rejection and fail-closed MFA ceremony
        run: node --test supabase/functions/ql369-owner-enrollment/verify.test.mjs
      - name: Verify QL-370 protected read-only owner progress and negative access cases
        run: node --test supabase/functions/ql369-owner-enrollment/ql370-progress.test.mjs
      - name: Verify QL-371 accessibility, expiry warning and non-authorizing cross-device handoff
        run: node --test scripts/__tests__/ql371-original-owner-guided-handoff.test.mjs
      - name: Verify QL-372 read-only supervised walkthrough, accessible focus and safe resume
        run: node --test scripts/__tests__/ql372-supervised-accessible-resume.test.mjs
      - name: Verify QL-373 safe owner help, negative access and independent device observations
        run: node --test scripts/__tests__/ql373-safe-owner-readiness.test.mjs
      - name: Verify QL-374 owner-only shell navigation and retired preflight truth without grants
        run: node --test scripts/__tests__/ql374-owner-entry-truth-review.test.mjs
      - name: Verify QL-375 six-app read-only status, shell boundaries and safe help links
        run: node --test scripts/__tests__/ql375-owner-six-app-status.test.mjs
      - name: Verify QL-376 protected alert filters, freshness and incident review remain non-authorizing
        run: node --test scripts/__tests__/ql376-owner-alert-freshness.test.mjs
      - name: Verify QL-377 owner incident history stays memory-only, accessible and non-authorizing
        run: node --test scripts/__tests__/ql377-owner-session-history.test.mjs
      - name: Verify QL-369 original-only activation decisions and no unattended signing
        run: node --test runtimes/hub-relay/ql369-activation-decision.test.mjs
      - name: Verify QL-369 Windows CI does not possess original activation authority
        shell: pwsh
        run: node runtimes/hub-relay/ql369-owner-activation-cli.mjs --help
      - name: Verify QL-340C current-user Windows DPAPI without real credentials
        shell: pwsh
        run: .\runtimes\hub-relay\ql340c-windows-operator.ps1 -SelfTest
      - name: Verify QL-340C receiver remains offline without real owner approvals
        shell: pwsh
        run: .\runtimes\hub-relay\ql340c-windows-operator.ps1 -Status
      - name: Verify QL-342 original Windows owner preflight stays read-only
        shell: pwsh
        run: .\runtimes\hub-relay\ql340c-windows-operator.ps1 -OwnerPreflight
      - name: Inspect missing keys without generating authority or network access
        run: node runtimes/hub-relay/owner-authority-custody.mjs --inspect

  public-worker-asset-parity:
    name: Public Worker JS/CSS SHA-256 parity
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: app-build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VITE_ENABLE_SUPABASE_CLIENT: 'false'
      VITE_ENABLE_HOSTED_DATABASE: 'false'
      VITE_PHONE_SMS_PROVIDER_ENABLED: 'false'
      VITE_PHONE_SMS_LIVE_PILOT_ENABLED: 'false'
      VITE_PHONE_SMS_CALLBACKS_ENABLED: 'false'
      VITE_PHONE_SMS_PERSISTENCE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Rebuild disabled production preview
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Verify public Worker serves exact built assets
        run: python3 scripts/ql328-public-asset-parity.py
