      - name: QL-492 Windows independent signer, due-date and offline Master audit regression
        run: node --test runtimes/master-discovery/ql492-field-witness-audit.test.mjs
      - name: QL-493 Windows mTLS preflight, offline Master custody and signer safety
        run: node --test runtimes/master-discovery/ql493-private-source-master-handoff.test.mjs
      - name: QL-494 Windows original-host source adapter, signer anti-replay and Master HOLD regression
        run: node --test runtimes/master-discovery/ql494-first-source-receiver.test.mjs
      - name: QL-495 Windows signed source receipt provenance, drift and Master trial anti-replay regression
        run: node --test runtimes/master-discovery/ql495-source-provenance-master-trial.test.mjs
      - name: QL-496 Windows Master mTLS contract, independent physical witness signature and durable receipt reconciliation
        run: node --test runtimes/master-discovery/ql496-master-endpoint-contract.test.mjs
      - name: QL-497 Windows independent Master signer, original-device witness and two-ledger readback safety
        run: node --test runtimes/master-discovery/ql497-independent-master-enrollment.test.mjs
      - name: QL-498 Windows independent Master provider ceremony and cross-host audit safety
        run: node --test runtimes/master-discovery/ql498-cross-host-runtime-evidence.test.mjs
      - name: QL-499 Windows real mTLS entrypoint remains manual and fails closed on CI
