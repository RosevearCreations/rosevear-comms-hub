name: App scaffold CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: node ../scripts/__tests__/ql170-release-receipt.test.mjs
      - run: node --test ../scripts/__tests__/ql171-operator-baseline.test.mjs
      - run: node ../scripts/ql171-operator-baseline.mjs
      - run: npm run build
